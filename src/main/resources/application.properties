spring.application.name=tante.tz
server.port=${SERVER_PORT:8085}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tantepay}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

tantepay.checkout.base-url=${CHECKOUT_BASE_URL:http://localhost:8085/checkout}
tantepay.payment-intent.expiry-scan-ms=${PAYMENT_INTENT_SCAN_MS:60000}
rent.manager.base.url=${RENT_MANAGER_BASE_URL:http://localhost:8083/rent-manager}
