spring:
  application:
    name: "tante-pay"
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/tante_pay}"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:root}"
  jpa:
    hibernate:
      ddl-auto: "${DDL_AUTO:update}"
    show-sql: "true"
    properties:
      hibernate:
        dialect: "org.hibernate.dialect.MySQLDialect"
  
  # Springdoc / OpenAPI Configuration
  swagger-ui:
    path: "/swagger-ui.html"
    enabled: "true"
  
springdoc:
  api-docs:
    path: "/v3/api-docs"
  swagger-ui:
    path: "/swagger-ui.html"
    enabled: "true"
    operationsSorter: "method"

server:
  port: "${SERVER_PORT:8085}"

tante:
    pay:
        url: "${TANTE_PAY_URL:http://localhost:8085}"

rent:
  manager:
    base:
      url: "${RENT_MANAGER_BASE_URL:http://localhost:8083/rent-manager}"
